[project]
name = "scientific-research-hub"
version = "1.0.0"
description = "Môi trường và thư viện phục vụ toàn diện cho bộ 57 Scientific Research Skills (research-hub, microsoft-research, cs-research-skills)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Nhóm 1: Kết nối cổng học thuật & Phân tích văn bản
    "feedparser>=6.0.12",
    "openreview-py>=2.2.3",
    "beautifulsoup4>=4.13.0",
    "pymupdf>=1.26.0",
    "scholarly>=1.7.11",
    "requests>=2.31.0",
    "numpy>=1.24.0",

    # Nhóm 2: Xử lý tài liệu, hình ảnh & âm thanh
    "python-docx>=1.1.2",
    "python-pptx>=0.6.23",
    "pillow>=10.0.0",
    "qrcode>=7.4.2",
    "edge-tts>=7.2.8",

    # Nhóm 3: Playwright & Render đồ họa / FFmpeg cục bộ
    "imageio-ffmpeg>=0.5.1",      # Chứa sẵn binary ffmpeg độc lập trong .venv
    "playwright>=1.40.0",          # Trình duyệt Chromium headless độc lập
    "lxml>=5.0.0",
    "pyphen>=0.14.0",
    "cairosvg>=2.7.1",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]
